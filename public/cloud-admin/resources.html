<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云资源 · SpringBok</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/connections.css"><script type="module" src="/shell.js"></script><script type="module" src="/resources.js"></script></head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<aside class="rail"><a class="brand" href="/" aria-label="SpringBok 首页" data-icon="brand">SpringBok</a><nav aria-label="主导航"><a href="/" data-icon="history"><span>历史部署</span></a>
<a href="/deploy" data-icon="deploy"><span>新建部署</span></a>
<a href="/resources" data-icon="resources" aria-current="page"><span>云资源</span></a>
<a href="/settings" data-icon="settings" class="nav-settings"><span>连接设置</span></a></nav></aside>
<header class="topbar"><span class="context">部署控制台 <span>/</span> <strong>云资源</strong></span><span>Cloudflare Workers</span></header>
<main id="main-content" tabindex="-1"><div class="page-heading"><div><p class="eyebrow">CLOUD RESOURCES</p><h1>云资源</h1></div><button id="resource-add" class="primary" type="button" data-icon="add">添加资源</button></div>
<div class="status-line"><p id="resource-notice" role="status" aria-live="polite">正在验证身份…</p></div>
<div id="resource-accounts"></div>
</main>
<dialog id="resource-dialog" aria-labelledby="resource-dialog-title">
<div class="section-heading"><h2 id="resource-dialog-title">添加资源</h2><button id="resource-close" type="button">关闭</button></div>
<form id="resource-form"><fieldset id="resource-fields" disabled>
<div class="resource-types brand-types" role="group" aria-label="云品牌">
<label><input type="radio" name="resource-brand" value="cloudflare" checked autofocus><span data-icon="cloudflare">Cloudflare</span></label>
<label><input type="radio" name="resource-brand" value="github"><span data-icon="github">GitHub</span></label>
</div>
<p id="resource-brand-help" class="field-note"></p>
<div class="field"><label for="resource-name">账户备注</label><input id="resource-name" maxlength="64" required autocomplete="off" placeholder="例如：生产账户"></div>
<div class="field"><label for="resource-token">API Token / GitHub PAT</label><input id="resource-token" type="password" minlength="20" maxlength="512" required autocomplete="new-password" spellcheck="false" aria-describedby="resource-secret-help"></div>
<details id="resource-account-field"><summary>指定 Cloudflare 账户（可选）</summary><label for="resource-account-id">Account ID</label><input id="resource-account-id" maxlength="32" pattern="[a-f0-9]{32}" autocomplete="off" spellcheck="false"><p class="field-note">默认自动识别全部可读取账户；若密钥不能列举账户，可填写指定账户 ID。</p></details>
<p id="resource-secret-help" class="field-note">密钥仅加密保存在服务端，保存后不回显。不接受 Cloudflare Global API Key。资源可读取不代表有部署写权限。</p>
<div class="actions"><button id="resource-save" class="primary" type="submit">验证密钥并添加</button></div>
</fieldset></form>
<p id="resource-dialog-notice" role="status" aria-live="polite"></p>
</dialog>
</body></html>
