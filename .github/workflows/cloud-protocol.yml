name: Cloud Node Protocol
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloud-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked Worker authentication dependency without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix cloud
      - name: Audit Worker authentication dependency
        run: python3 scripts/run_dependency_audit.py npm --output .tmp/security-reports/cloud -- npm audit --package-lock-only --include=dev --include=optional --include=peer --audit-level=low --prefix cloud --json
      - name: Install locked local workerd test runtime without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/cloud
      - name: Audit all locked protocol test dependencies
        run: python3 scripts/run_dependency_audit.py npm --output .tmp/security-reports/tests-cloud -- npm audit --package-lock-only --include=dev --include=optional --include=peer --audit-level=low --prefix tests/cloud --json
      - name: Exercise actual local workerd and SQLite persistence with synthetic credentials
        run: npm test --prefix tests/cloud
      - name: Retain security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports-${{ github.job }}-${{ github.run_id }}
          path: .tmp/security-reports
          include-hidden-files: true
          if-no-files-found: error
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate Compose syntax with empty temporary input files; no startup
        env:
          SPRINGBOK_ROOTLESS_UID: '1001'
          SPRINGBOK_MONGO_ENV_FILE: /tmp/springbok-empty-env
          SPRINGBOK_CORE_ENV_FILE: /tmp/springbok-empty-env
          SPRINGBOK_CORE_PASSWORD_FILE: /tmp/springbok-empty-env
          SPRINGBOK_NODE_TOKEN_FILE: /tmp/springbok-empty-env
          SPRINGBOK_INVENTORY_FILE: /tmp/springbok-empty-env
          SPRINGBOK_CONTROL_ORIGIN: https://control.example.invalid
        run: |
          touch /tmp/springbok-empty-env
          docker compose -f deploy/node-fixture/compose.yaml --profile acceptance config --quiet
          rm /tmp/springbok-empty-env
      - name: Test fixture-only containers and a fresh named volume without a daemon mount
        run: bash scripts/ci/node-fixture-smoke.sh
