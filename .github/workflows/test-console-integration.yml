name: Real Test Console Integration
on:
  workflow_dispatch:
    inputs:
      approve_temporary_docker_admin:
        description: Authorize this run's temporary Docker control, loopback services and disposable credentials
        required: true
        type: boolean
        default: false
      reviewed_sha:
        description: Exact independently reviewed main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: springbok-m10-disposable
  cancel-in-progress: false
jobs:
  real-console:
    if: github.repository == 'aiaimimi0920/SpringBok' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_temporary_docker_admin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - name: Bind reviewed source before checkout
        run: |
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$REVIEWED_SHA" == "$GITHUB_SHA" ]] || exit 2
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ env.REVIEWED_SHA }}
      - name: Verify checked-out reviewed source
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked test-only browser client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
      - name: User-level official Ubuntu CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m10-fonts" "$HOME/.local/share/fonts/springbok-m10"
          cd "$RUNNER_TEMP/m10-fonts"
          apt-get download fonts-noto-cjk
          packages=(fonts-noto-cjk_*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --extract "${packages[0]}" extracted
          cp extracted/usr/share/fonts/opentype/noto/*.ttc "$HOME/.local/share/fonts/springbok-m10/"
          fc-cache -f "$HOME/.local/share/fonts/springbok-m10"
          fc-list :lang=zh family | grep 'Noto Sans CJK' >/dev/null
      - name: Run approved disposable real test console
        env:
          SPRINGBOK_ALLOW_M10_TEST: 'yes'
        run: bash scripts/test-console/komodo.sh
      - name: Store test-only UI screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: springbok-m10-test-console
          path: test-results/m10/*.png
          retention-days: 3
          if-no-files-found: error
