<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接设置 · SpringBok</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/connections.css"><script type="module" src="/shell.js"></script><script type="module" src="/connections.js"></script></head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<aside class="rail"><a class="brand" href="/" aria-label="SpringBok 首页" data-icon="brand">SpringBok</a><nav aria-label="主导航"><a href="/services" data-icon="deploy"><span>服务</span></a>
<a href="/resources" data-icon="resources"><span>云资源</span></a>
<a href="/settings" data-icon="settings" aria-current="page" class="nav-settings"><span>连接设置</span></a></nav></aside>
<header class="topbar"><span class="context">部署控制台 <span>/</span> <strong>连接设置</strong></span><span>Cloudflare Workers</span></header>
<main id="main-content" tabindex="-1"><div class="page-heading"><div><p class="eyebrow">CONNECTIONS</p><h1>连接设置</h1></div><button id="connections-refresh" type="button" data-icon="refresh">刷新连接</button></div>
<div class="status-line"><p id="connection-identity">正在验证管理员身份…</p><p id="connection-status" role="status" aria-live="polite">读取连接…</p></div>
<div class="board">
<section aria-labelledby="add-heading"><div class="section-heading"><h2 id="add-heading">添加连接</h2><span class="index">01 / CONNECT</span></div>
<form id="connection-form"><fieldset id="connection-fields" disabled><div class="form-grid">
<div class="field"><label for="connection-provider">平台</label><select id="connection-provider"><option value="cloudflare">Cloudflare</option><option value="github">GitHub</option></select></div>
<div class="field"><label for="connection-name">连接名称</label><input id="connection-name" maxlength="64" required placeholder="例如：生产 Cloudflare" autocomplete="off"></div>
<div class="field span-all"><label id="connection-target-label" for="connection-target">Cloudflare Account ID</label><input id="connection-target" maxlength="140" required autocomplete="off" spellcheck="false"></div>
<div class="field span-all"><label id="connection-token-label" for="connection-token">API Token</label><input id="connection-token" type="password" minlength="20" maxlength="512" required autocomplete="new-password" spellcheck="false"></div>
</div><div class="actions"><button id="connection-save" type="submit">验证并保存</button><button id="connection-clear" type="button">清空输入</button></div></fieldset></form></section>
<section aria-labelledby="list-heading"><div class="section-heading"><h2 id="list-heading">已添加连接</h2><span class="index">02 / MANAGE</span></div><ul id="connections-list"></ul></section></div>
<dialog id="connection-disable-dialog" aria-labelledby="disable-heading"><h2 id="disable-heading">停用连接</h2><p id="connection-disable-target"></p><div class="actions"><button id="connection-disable-cancel" type="button" autofocus>取消</button><button id="connection-disable-confirm" type="button">确认停用</button></div></dialog>
</main>
</body></html>
