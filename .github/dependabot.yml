version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  # Browser-test tooling only; the demo has no runtime dependencies.
  - package-ecosystem: npm
    directory: "/tests/browser"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
