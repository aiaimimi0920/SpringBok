<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpringBok · 配置检查</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><strong>SpringBok</strong><span>配置检查 · 未连接服务器</span></header>
<main><p class="eyebrow">部署准备</p><h1>先核对配置，再安排部署</h1><p>选择你的服务JSON，在本机校验目标、镜像、端口和命名卷。输入只送到当前loopback服务，不保存；不要填写真实密钥。</p>
<section class="upload" aria-labelledby="upload-title"><h2 id="upload-title">选择服务配置</h2><label for="config-file">JSON文件 · UTF-8 · 最大64KiB</label><input id="config-file" type="file" accept=".json,application/json" disabled><div class="controls"><button id="reset" type="button">清空</button><button id="download" type="button" disabled>下载校验草稿</button></div><p id="status" role="status" aria-live="polite">正在建立本地会话…</p></section>
<section id="result" aria-labelledby="result-title" hidden><h2 id="result-title">配置草稿</h2><p class="boundary">校验通过只表示输入符合规则，不表示服务器可用、配置已导入或允许执行部署。</p><dl id="overview"></dl><div id="services"></div></section>
<p class="footnote">此页面没有连接、导入或执行按钮。生产认证、镜像健康、网络与数据备份仍需单独核对。关闭或返回页面会清除本次结果。</p></main></body></html>
