name: Real Test Console Integration
on:
  # Temporary M6 bootstrap; removed before merge. Executes only the reviewed SHA below.
  push:
    branches: [feat/real-test-console-m6]
  workflow_dispatch:
    inputs:
      approve_temporary_docker_admin:
        description: Authorize this run's temporary Docker control, loopback services and disposable credentials
        required: true
        type: boolean
        default: false
      reviewed_sha:
        description: Exact independently reviewed main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: springbok-m6-disposable
  cancel-in-progress: false
jobs:
  real-console:
    if: github.repository == 'aiaimimi0920/SpringBok' && ((github.event_name == 'push' && github.ref == 'refs/heads/feat/real-test-console-m6') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_temporary_docker_admin))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEWED_SHA: ${{ github.event_name == 'push' && 'd5ba59c1271e23d35381e7ddd9b23839080d695a' || inputs.reviewed_sha }}
    steps:
      - name: Bind reviewed source before checkout
        run: |
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$REVIEWED_SHA" == d5ba59c1271e23d35381e7ddd9b23839080d695a ]] || exit 2
          else
            [[ "$REVIEWED_SHA" == "$GITHUB_SHA" ]] || exit 2
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ env.REVIEWED_SHA }}
      - name: Verify checked-out reviewed source
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked test-only browser client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
      - name: User-level official Ubuntu CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m6-fonts" "$HOME/.local/share/fonts/springbok-m6"
          cd "$RUNNER_TEMP/m6-fonts"
          apt-get download fonts-noto-cjk
          packages=(fonts-noto-cjk_*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --extract "${packages[0]}" extracted
          cp extracted/usr/share/fonts/opentype/noto/*.ttc "$HOME/.local/share/fonts/springbok-m6/"
          fc-cache -f "$HOME/.local/share/fonts/springbok-m6"
          fc-list :lang=zh family | grep 'Noto Sans CJK' >/dev/null
      - name: Run approved disposable real test console
        env:
          SPRINGBOK_ALLOW_M6_TEST: 'yes'
        run: bash scripts/test-console/komodo.sh
      - name: Store test-only UI screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: springbok-m6-test-console
          path: test-results/m6/*.png
          retention-days: 3
          if-no-files-found: error
