<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpringBok · 临时真实集成测试</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><div class="brand">SpringBok <span>单机测试工作台</span></div><strong class="badge">临时集成测试 · 非生产认证</strong></header>
<main><h1>真实测试执行与发布记录</h1><p>此界面仅由隔离 GitHub 测试机启动。操作真实样例容器，不是真实业务或生产服务。测试验收不代表用户生产授权。</p><button id="refresh" type="button">刷新记录</button><p id="notice" role="status" aria-live="polite">读取记录…</p><section id="readiness" aria-label="固定资源只读检查"><h2>固定资源只读检查</h2><p>核对固定的测试/生产角色资源和 Core 缓存状态，不代表即时连通、容器健康或发布许可。</p><div class="readiness-controls"><button id="readiness-check" type="button" disabled>检查固定资源</button><button id="readiness-cancel" type="button" disabled>取消检查</button><button id="readiness-close" type="button" hidden>关闭检查结果</button></div><p id="readiness-status" role="status" aria-live="polite">尚未读取资源</p><div id="readiness-results"></div></section><section id="services" class="grid" aria-label="四类测试服务"></section><section class="history"><h2>持久执行记录</h2><p>配置准备、执行意图、Update ID 和结果分别记录。未知提交不会自动重试；刷新证据只读取已知执行。</p><ol id="history"></ol></section><dialog id="execution-review" aria-labelledby="review-title"><div class="review-top"><h2 id="review-title">确认本次测试操作</h2><button id="review-close" type="button" aria-label="关闭执行确认">关闭</button></div><p class="review-boundary">仅操作临时测试资源。此确认不是测试验收，也不是生产授权。</p><p id="review-status" role="status">正在读取计划…</p><dl id="review-details" class="details"></dl><div class="review-actions"><button id="review-cancel" type="button">取消</button><button id="review-submit" class="primary" type="button" disabled>确认执行此计划</button></div></dialog></main></body></html>
