name: Demo Browser
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: demo-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked browser-test dependency only
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
      - name: Install locked local Worker runtime and authentication for synthetic admin tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix cloud
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/cloud
      - name: Load official Ubuntu CJK fonts into the disposable user font directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/demo-fonts" "$HOME/.local/share/fonts/springbok-demo"
          cd "$RUNNER_TEMP/demo-fonts"
          apt-get download fonts-noto-cjk
          packages=(fonts-noto-cjk_*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --extract "${packages[0]}" extracted
          cp extracted/usr/share/fonts/opentype/noto/*.ttc "$HOME/.local/share/fonts/springbok-demo/"
          fc-cache -f "$HOME/.local/share/fonts/springbok-demo"
          fc-list :lang=zh family | grep -q 'Noto Sans CJK'
      - name: Exercise the loopback-only demo in the runner's Chrome
        run: node tests/browser/demo.mjs
      - name: Exercise execution confirmation with a fake backend (no containers or credentials)
        run: node tests/browser/execution-review.mjs
      - name: Check local user configuration UI without deployment or credentials
        run: node tests/browser/config-review.mjs
      - name: Check private cloud management with synthetic Access JWTs and actual workerd
        run: node tests/browser/cloud-admin.mjs
      - name: Check SBA confirmation and receipt UI with synthetic GitHub and actual workerd
        run: node tests/browser/sba.mjs
      - name: Check encrypted connection settings with synthetic providers and actual workerd
        run: node tests/browser/connections.mjs
      - name: Check existing cloud resource discovery and registration
        run: node tests/browser/resources.mjs
      - name: Check dual resource views, usage aggregation and planning without cloud writes
        run: node tests/browser/resource-usage.mjs
      - name: Check declaration-driven deployment planning without dispatch
        run: node tests/browser/deployment-plan.mjs
      - name: Check connected deployment execution with synthetic GitHub and actual workerd
        run: node tests/browser/connected-execution.mjs
      - name: Check service discovery, independent statistics and same-instance version updates
        run: node tests/browser/service-lifecycle.mjs
      - name: Check bounded service discovery across slow repositories and pages
        run: node tests/browser/service-discovery.mjs
      - name: Check read-only service import and persistent imported instances
        run: node tests/browser/service-import.mjs
      - name: Check automatic resource creation and retained-resource service updates
        run: node tests/browser/automatic-deployment.mjs
      - name: Check Neuro shell, colors, responsive layouts and keyboard states
        run: node tests/browser/neuro-ui.mjs
      - name: Check catalog, enrollment and telemetry UI on Linux
        run: |
          node tests/browser/server-catalog.mjs
          node tests/browser/service-catalog.mjs
          node tests/browser/node-enrollment.mjs
          node tests/browser/node-heartbeat.mjs
          node tests/browser/node-telemetry.mjs
          node tests/browser/network-telemetry.mjs
      - name: Save demo and clearly labeled fake-backend screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: springbok-demo-screenshots
          path: test-results/*.png
          retention-days: 3
          if-no-files-found: error
