<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云资源 · SpringBok</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/connections.css"><script type="module" src="/resources.js"></script></head><body>
<header><strong>SpringBok</strong><nav aria-label="主导航"><a href="/">历史部署</a><a href="/deploy">新建部署</a><a href="/settings">连接设置</a><a href="/resources" aria-current="page">云资源</a></nav></header>
<main><h1>已有云资源</h1><p id="resource-notice" role="status" aria-live="polite">正在验证身份…</p><button id="resource-refresh">刷新连接与登记</button>
<section><h2>选择 Cloudflare 资源</h2><form id="resource-form"><fieldset id="resource-fields" disabled><label for="resource-connection">Cloudflare 连接</label><select id="resource-connection" required></select><label for="resource-kind">资源类型</label><select id="resource-kind"><option value="d1">D1 数据库</option><option value="kv">KV namespace</option><option value="r2">R2 bucket（默认管辖区）</option></select><button id="resource-load" type="submit">读取已有资源</button></fieldset></form><p>只读取并登记已有资源，不创建或修改云资源。需要对应类型的读取权限，每页最多 100 条。</p><ul id="resource-discovered"></ul><button id="resource-next" type="button" disabled>下一页</button></section>
<section><h2>已登记资源</h2><p>显示最近读取时间；部署前还需重新核对资源。连接停用或修订变化后，旧登记不可用于新部署。</p><ul id="resource-registered"></ul></section></main></body></html>
