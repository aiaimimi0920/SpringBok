name: Demo Browser
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: demo-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked browser-test dependency only
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
      - name: Load official Ubuntu CJK fonts into the disposable user font directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/demo-fonts" "$HOME/.local/share/fonts/springbok-demo"
          cd "$RUNNER_TEMP/demo-fonts"
          apt-get download fonts-noto-cjk
          packages=(fonts-noto-cjk_*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --extract "${packages[0]}" extracted
          cp extracted/usr/share/fonts/opentype/noto/*.ttc "$HOME/.local/share/fonts/springbok-demo/"
          fc-cache -f "$HOME/.local/share/fonts/springbok-demo"
          fc-list :lang=zh family | grep -q 'Noto Sans CJK'
      - name: Exercise the loopback-only demo in the runner's Chrome
        run: node tests/browser/demo.mjs
      - name: Exercise execution confirmation with a fake backend (no containers or credentials)
        run: node tests/browser/execution-review.mjs
      - name: Save demo and clearly labeled fake-backend screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: springbok-demo-screenshots
          path: test-results/*.png
          retention-days: 3
          if-no-files-found: error
