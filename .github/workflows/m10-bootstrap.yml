# TEMPORARY: publish only after specific user permission and exact-tree review.
# Remove after the authorized test; never merge this trigger into main.
name: M10 Authorized Disposable Verification
on:
  push:
    branches: [test/combined-console-m10]
permissions:
  contents: read
concurrency:
  group: springbok-m10-authorized-bootstrap
  cancel-in-progress: false
jobs:
  real-console:
    if: github.repository == 'aiaimimi0920/SpringBok' && github.event_name == 'push' && github.ref == 'refs/heads/test/combined-console-m10' && github.event.before == 'd91d8572dd820b0448c9b106f964478c41a0abc4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEWED_SHA: d91d8572dd820b0448c9b106f964478c41a0abc4
    steps:
      - name: Bind reviewed source before checkout
        run: |
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$REVIEWED_SHA" == 'd91d8572dd820b0448c9b106f964478c41a0abc4' ]] || exit 2
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: d91d8572dd820b0448c9b106f964478c41a0abc4
      - name: Verify checked-out reviewed source
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked test-only browser client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
      - name: User-level official Ubuntu CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m10-fonts" "$HOME/.local/share/fonts/springbok-m10"
          cd "$RUNNER_TEMP/m10-fonts"
          apt-get download fonts-noto-cjk
          packages=(fonts-noto-cjk_*.deb)
          [[ ${#packages[@]} == 1 ]]
          dpkg-deb --extract "${packages[0]}" extracted
          cp extracted/usr/share/fonts/opentype/noto/*.ttc "$HOME/.local/share/fonts/springbok-m10/"
          fc-cache -f "$HOME/.local/share/fonts/springbok-m10"
          fc-list :lang=zh family | grep 'Noto Sans CJK' >/dev/null
      - name: Run approved disposable real test console
        env:
          SPRINGBOK_ALLOW_M10_TEST: 'yes'
        run: bash scripts/test-console/komodo.sh
      - name: Store test-only UI screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: springbok-m10-test-console
          path: test-results/m10/*.png
          retention-days: 3
          if-no-files-found: error
