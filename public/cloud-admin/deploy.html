<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务 · SpringBok</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/services.css"><script type="module" src="/shell.js"></script><script type="module" src="/services.js"></script></head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<aside class="rail"><a class="brand" href="/" aria-label="SpringBok 首页" data-icon="brand">SpringBok</a><nav aria-label="主导航"><a href="/services" data-icon="deploy" aria-current="page"><span>服务</span></a>
<a href="/resources" data-icon="resources"><span>云资源</span></a>
<a href="/settings" data-icon="settings" class="nav-settings"><span>连接设置</span></a></nav></aside>
<header class="topbar service-topbar"><span class="context">部署控制台 <span>/</span> <strong>服务</strong></span><span id="service-loading" role="status" aria-live="polite"></span></header>
<main id="main-content" tabindex="-1"><div class="page-heading"><div><p class="eyebrow">SERVICES</p><h1>服务</h1></div><button id="service-add" class="primary" type="button" data-icon="deploy">部署服务</button></div>
<div class="status-line"><p id="service-notice" role="status" aria-live="polite"></p></div>
<p id="service-empty">尚无服务部署</p><ul id="service-list" aria-label="服务实例"></ul>
</main>
<dialog id="service-dialog" aria-labelledby="service-dialog-title">
<div class="section-heading"><h2 id="service-dialog-title">部署服务</h2><button id="service-close" type="button">关闭</button></div>
<div id="service-tabs" role="tablist" aria-label="可部署服务"></div>
<p id="service-catalog-status" role="status" aria-live="polite"></p>
<form id="service-form"><div class="service-form-scroll">
<div id="service-edit" role="tabpanel"><p id="service-selection"></p><fieldset id="service-fields" disabled>
<div class="field"><label for="service-version">版本</label><select id="service-version" required></select></div>
<div class="field"><label for="service-cloudflare">目标账户</label><select id="service-cloudflare" required></select></div>
<div class="field"><label for="service-environment">环境</label><input id="service-environment" pattern="[a-z][a-z0-9-]{1,62}" maxlength="63" placeholder="例如 staging" required></div>
<div id="service-resources"></div><h3>公开配置 · 勿填密钥</h3><div id="service-inputs"></div>
</fieldset></div><div id="service-review" hidden></div>
</div><div class="service-dialog-footer"><p id="service-dialog-notice" role="status" aria-live="polite"></p><button id="service-back" type="button" hidden>返回修改</button><button id="service-submit" class="primary" type="submit" disabled>部署</button></div></form>
</dialog>
</body></html>
